<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký – email đã được dùng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="min-height: 100vh;"><div><div style="position: relative; min-height: 100vh; display: flex; flex-direction: column; background: rgb(245, 245, 245); color: rgb(34, 34, 34); font-family: Inter, system-ui, &quot;Segoe UI&quot;, sans-serif; font-size: 14px; line-height: 20px;"><div><header style="position: relative; z-index: 5; background: linear-gradient(rgb(245, 61, 45) 0%, rgb(255, 102, 51) 100%); color: rgb(255, 255, 255); font-family: Inter, system-ui, &quot;Segoe UI&quot;, sans-serif; font-size: 14px; line-height: 20px;">
  <div style="max-width: 1232px; margin: 0px auto; padding: 2px 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; font-size: 13px; line-height: 16px;">
      <a href="FlashSales.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 32px; color: rgb(255, 255, 255); text-decoration: none; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8Z"></path></svg>Flash sale</a>
      
      
        <a href="Auth.html" style="display: inline-flex; align-items: center; min-height: 32px; color: rgb(255, 255, 255); text-decoration: none; font-weight: 600;">Đăng nhập</a>
      
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="Main.html" style="flex: 0 0 auto; color: rgb(255, 255, 255); text-decoration: none; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em;">SaleScale</a>
      <div role="search" style="flex: 1 1 160px; min-width: 0px; display: flex; align-items: center; background: rgb(255, 255, 255); border-radius: 2px; padding: 3px; box-shadow: rgba(0, 0, 0, 0.09) 0px 1px 1px;">
        <input type="search" aria-label="Tìm sản phẩm theo tên" placeholder="Tìm sản phẩm theo tên" style="flex: 1 1 auto; min-width: 0px; border: 0px; padding: 6px 10px; background: transparent; color: rgb(34, 34, 34); font: inherit;">
        <button type="button" aria-label="Tìm kiếm" style="flex: 0 0 auto; width: 52px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgb(238, 77, 45); color: rgb(255, 255, 255); border: 0px; border-radius: 2px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.75"></circle><path d="M10.5 10.5 14 14"></path></svg>
        </button>
      </div>
      <a href="Cart.html" aria-label="Giỏ hàng, 0 sản phẩm" style="position: relative; flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h2.4l2.3 11h11.3l2-7.5H6"></path><circle cx="9" cy="19.25" r="1.4"></circle><circle cx="17" cy="19.25" r="1.4"></circle></svg>
        
      </a>
    </div>
  </div></header></div><main style="flex: 1 0 auto; width: 100%; max-width: 472px; margin: 0px auto; padding: 32px 16px; box-sizing: border-box;">
  <section aria-labelledby="auth-title" style="background: rgb(255, 255, 255); border: 1px solid rgb(232, 232, 232); border-radius: 4px; box-shadow: rgba(0, 0, 0, 0.04) 0px 1px 2px; padding: 0px 24px 24px; display: flex; flex-direction: column; gap: 16px;">
    <nav aria-label="Chọn đăng nhập hoặc đăng ký" style="display: flex; margin: 0px -24px; border-bottom: 1px solid rgb(232, 232, 232);">
      <a href="Auth.html" aria-current="false" style="flex: 1 1 0px; display: flex; align-items: center; justify-content: center; min-height: 48px; border-bottom: 2px solid transparent; color: rgb(117, 117, 117); font-weight: 600; text-decoration: none;">Đăng nhập</a>
      <a href="Auth-register.html" aria-current="page" style="flex: 1 1 0px; display: flex; align-items: center; justify-content: center; min-height: 48px; border-bottom: 2px solid rgb(238, 77, 45); color: rgb(215, 50, 17); font-weight: 600; text-decoration: none;">Đăng ký</a>
    </nav>

    <h1 id="auth-title" style="margin: 0px; font-size: 20px; line-height: 28px; font-weight: 600;">Tạo tài khoản</h1>

    
      <div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: rgb(255, 255, 255); border-width: 1px 1px 1px 4px; border-style: solid; border-color: rgb(232, 232, 232) rgb(232, 232, 232) rgb(232, 232, 232) rgb(208, 1, 27); border-image: none; border-radius: 4px;">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#D0011B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px;"><path d="M8 2.25 14.5 13.5h-13Z M8 6.5v3 M8 11.6v.2"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 600; color: rgb(208, 1, 27);">Email này đã được dùng</span>
          <span style="color: rgb(117, 117, 117);">Hãy đăng nhập bằng email này hoặc dùng email khác để đăng ký.</span>
          
          
            <a href="Auth.html" style="align-self: flex-start; margin-top: 4px; color: rgb(215, 50, 17); font-weight: 600; text-decoration: none;">Đăng nhập bằng email này</a>
          
        </div>
      </div>
    

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="auth-email" style="font-weight: 500;">Email</label>
      <input id="auth-email" type="email" autocomplete="email" placeholder="ten@email.com" aria-invalid="false" aria-describedby="auth-email-err" value="minhanh@example.com" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 8px 12px; background: rgb(255, 255, 255); border: 1px solid rgb(189, 189, 189); border-radius: 2px; color: rgb(34, 34, 34); font: inherit;">
      
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="auth-pass" style="font-weight: 500;">Mật khẩu</label>
      <div style="display: flex; align-items: stretch; background: rgb(255, 255, 255); border: 1px solid rgb(189, 189, 189); border-radius: 2px;">
        <input id="auth-pass" type="password" autocomplete="new-password" aria-invalid="false" aria-describedby="auth-pass-hint" value="matkhau2026" style="flex: 1 1 auto; min-width: 0px; min-height: 42px; padding: 8px 12px; background: transparent; border: 0px; color: rgb(34, 34, 34); font: inherit;">
        <button type="button" aria-pressed="false" aria-label="Hiện mật khẩu" style="flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 0px 12px; background: transparent; border-width: 0px 0px 0px 1px; border-style: none none none solid; border-color: currentcolor currentcolor currentcolor rgb(232, 232, 232); border-image: none; color: rgb(97, 97, 97); font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8s2.5-4.75 6.5-4.75S14.5 8 14.5 8s-2.5 4.75-6.5 4.75S1.5 8 1.5 8Z"></path><circle cx="8" cy="8" r="2"></circle></svg>Hiện</button>
      </div>
      
      
        <span id="auth-pass-hint" style="font-size: 12px; line-height: 16px; color: rgb(117, 117, 117);">Tối thiểu 8 ký tự</span>
      
    </div>

    <button type="button" aria-busy="false" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; background: rgb(238, 77, 45); border: 1px solid rgb(238, 77, 45); border-radius: 2px; color: rgb(255, 255, 255); font-style: inherit; font-variant: inherit; font-stretch: inherit; font-size: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-weight: 700; cursor: pointer;">
      
      Tạo tài khoản</button>

    <p style="margin: 0px; text-align: center; color: rgb(117, 117, 117);">Đã có tài khoản? <a href="Auth.html" style="color: rgb(215, 50, 17); font-weight: 600; text-decoration: none;">Đăng nhập</a></p>
  </section></main><footer style="background: rgb(255, 255, 255); border-top: 1px solid rgb(232, 232, 232);">
  <div style="max-width: 1232px; margin: 0px auto; padding: 16px; box-sizing: border-box; font-size: 12px; line-height: 16px; color: rgb(117, 117, 117);">© 2026 SaleScale</div></footer></div></div></div>
</body>
</html>
