<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaleScale – Header trang khách</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<header style="position: relative; z-index: 5; background: linear-gradient(rgb(245, 61, 45) 0%, rgb(255, 102, 51) 100%); color: rgb(255, 255, 255); font-family: Inter, system-ui, &quot;Segoe UI&quot;, sans-serif; font-size: 14px; line-height: 20px;">
  <div style="max-width: 1232px; margin: 0px auto; padding: 2px 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; font-size: 13px; line-height: 16px;">
      <a href="FlashSales.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 32px; color: rgb(255, 255, 255); text-decoration: none; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8Z"></path></svg>Flash sale</a>
      
        <div style="position: relative;">
          <button type="button" aria-haspopup="menu" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0px 4px; background: transparent; border: 0px; color: rgb(255, 255, 255); font-style: inherit; font-variant: inherit; font-stretch: inherit; font-size: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-weight: 500; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="5.5" r="2.75"></circle><path d="M2.75 14c0-2.9 2.35-4.75 5.25-4.75S13.25 11.1 13.25 14"></path></svg>Minh Anh<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg>
          </button>
          
        </div>
      
      
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="Main.html" style="flex: 0 0 auto; color: rgb(255, 255, 255); text-decoration: none; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em;">SaleScale</a>
      <div role="search" style="flex: 1 1 160px; min-width: 0px; display: flex; align-items: center; background: rgb(255, 255, 255); border-radius: 2px; padding: 3px; box-shadow: rgba(0, 0, 0, 0.09) 0px 1px 1px;">
        <input type="search" aria-label="Tìm sản phẩm theo tên" placeholder="Tìm sản phẩm theo tên" style="flex: 1 1 auto; min-width: 0px; border: 0px; padding: 6px 10px; background: transparent; color: rgb(34, 34, 34); font: inherit;">
        <button type="button" aria-label="Tìm kiếm" style="flex: 0 0 auto; width: 52px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgb(238, 77, 45); color: rgb(255, 255, 255); border: 0px; border-radius: 2px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.75"></circle><path d="M10.5 10.5 14 14"></path></svg>
        </button>
      </div>
      <a href="Cart.html" aria-label="Giỏ hàng, 3 sản phẩm" style="position: relative; flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h2.4l2.3 11h11.3l2-7.5H6"></path><circle cx="9" cy="19.25" r="1.4"></circle><circle cx="17" cy="19.25" r="1.4"></circle></svg>
        
          <span aria-hidden="true" style="position: absolute; top: 2px; right: -4px; min-width: 20px; height: 18px; padding: 0px 5px; box-sizing: border-box; border-radius: 10px; background: rgb(255, 255, 255); color: rgb(215, 50, 17); font-size: 12px; line-height: 18px; font-weight: 600; text-align: center;">3</span>
        
      </a>
    </div>
  </div></header>
</body>
</html>
